<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Continuous lifecycle for agentic AI governance</title>
  <desc id="desc">A circular lifecycle showing pre-deployment review, red teaming, controlled pilot, active deployment, monitoring, automated evaluation, and improvement.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,7 L10,3.5 z" fill="#2E86AB"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.16"/></filter>
    <style>.text{font-family:Arial, Helvetica, sans-serif;fill:#263238}.title{font-size:31px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:13px}.arrow{stroke:#2E86AB;stroke-width:4;fill:none;marker-end:url(#arrow)}.card{filter:url(#shadow);stroke-width:2}</style>
  </defs>
  <rect width="1200" height="760" fill="#F8FBFD"/>
  <text x="600" y="52" class="text title" text-anchor="middle">Continuous Governance Lifecycle for Agentic AI</text>
  <text x="600" y="84" class="text small" text-anchor="middle">Safe deployment is not a one-time approval. It is a repeated cycle of evidence, control, monitoring, and improvement.</text>
  <circle cx="600" cy="395" r="165" fill="#FFFFFF" stroke="#C8D3E0" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="375" class="text label" text-anchor="middle">Residual-risk</text>
  <text x="600" y="400" class="text label" text-anchor="middle">decision</text>
  <text x="600" y="430" class="text small" text-anchor="middle">approve, pilot, pause,</text>
  <text x="600" y="450" class="text small" text-anchor="middle">rollback, or re-test</text>

  <g class="text" text-anchor="middle">
    <rect x="465" y="125" width="270" height="82" rx="18" fill="#E8F3FF" stroke="#2E86AB" class="card"/>
    <text x="600" y="157" class="label">1. Pre-deployment review</text><text x="600" y="182" class="small">scope, autonomy, tools, data</text>
    <rect x="805" y="225" width="270" height="82" rx="18" fill="#FFF4D6" stroke="#E3A321" class="card"/>
    <text x="940" y="257" class="label">2. Red-team testing</text><text x="940" y="282" class="small">scenarios, edge cases, guardrails</text>
    <rect x="845" y="475" width="270" height="82" rx="18" fill="#E9F7EF" stroke="#2FA66A" class="card"/>
    <text x="980" y="507" class="label">3. Controlled pilot</text><text x="980" y="532" class="small">limited tools and approval gates</text>
    <rect x="465" y="610" width="270" height="82" rx="18" fill="#FDE4EA" stroke="#D1495B" class="card"/>
    <text x="600" y="642" class="label">4. Active deployment</text><text x="600" y="667" class="small">logged actions and interruptions</text>
    <rect x="85" y="475" width="270" height="82" rx="18" fill="#EFEAFE" stroke="#6B4EFF" class="card"/>
    <text x="220" y="507" class="label">5. Monitoring</text><text x="220" y="532" class="small">loops, cost, drift, incidents</text>
    <rect x="125" y="225" width="270" height="82" rx="18" fill="#E8F3FF" stroke="#2E86AB" class="card"/>
    <text x="260" y="257" class="label">6. Automated evaluation</text><text x="260" y="282" class="small">regression and policy checks</text>
  </g>

  <path d="M710 185 C790 185, 840 205, 875 238" class="arrow"/>
  <path d="M1010 305 C1060 360, 1065 420, 1010 475" class="arrow"/>
  <path d="M930 555 C865 610, 795 640, 735 650" class="arrow"/>
  <path d="M465 650 C380 642, 305 610, 255 557" class="arrow"/>
  <path d="M190 475 C145 415, 150 355, 220 305" class="arrow"/>
  <path d="M350 225 C405 175, 455 160, 465 160" class="arrow"/>

  <g class="text small">
    <text x="600" y="725" text-anchor="middle">The lifecycle supports continuous improvement after each deployment, incident, model update, prompt change, or tool-permission change.</text>
  </g>
</svg>
