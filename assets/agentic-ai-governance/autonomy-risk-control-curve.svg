<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Autonomy, controls, and residual agentic AI risk</title>
  <desc id="desc">A conceptual graph showing unmanaged risk increasing as autonomy increases, and governed residual risk reduced by stronger controls.</desc>
  <defs>
    <linearGradient id="riskGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2E86AB"/>
      <stop offset="50%" stop-color="#F6C85F"/>
      <stop offset="100%" stop-color="#D1495B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#F8FBFD"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0B1026">Autonomy-Risk Equation for Agentic AI</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D4A5C">Residual risk rises when autonomy and impact grow faster than technical and process controls.</text>
  <line x1="130" y1="610" x2="1040" y2="610" stroke="#263238" stroke-width="3"/>
  <line x1="130" y1="610" x2="130" y2="150" stroke="#263238" stroke-width="3"/>
  <polygon points="1040,610 1022,600 1022,620" fill="#263238"/>
  <polygon points="130,150 120,168 140,168" fill="#263238"/>
  <text x="590" y="665" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#263238">Autonomy and directedness of impact</text>
  <text x="58" y="390" transform="rotate(-90 58 390)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#263238">Risk exposure</text>
  <path d="M150 570 C310 535, 410 480, 520 400 C650 300, 760 205, 1015 165" fill="none" stroke="#D1495B" stroke-width="7" stroke-linecap="round"/>
  <path d="M150 575 C300 555, 425 525, 555 475 C690 420, 820 360, 1015 285" fill="none" stroke="#2E86AB" stroke-width="7" stroke-linecap="round"/>
  <rect x="725" y="150" width="360" height="155" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <line x1="750" y1="192" x2="820" y2="192" stroke="#D1495B" stroke-width="7" stroke-linecap="round"/>
  <text x="840" y="199" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263238">Unmanaged autonomy</text>
  <line x1="750" y1="238" x2="820" y2="238" stroke="#2E86AB" stroke-width="7" stroke-linecap="round"/>
  <text x="840" y="245" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263238">Governed residual risk</text>
  <text x="750" y="283" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D4A5C">Controls reduce, but do not remove, residual risk.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263238">
    <rect x="170" y="520" width="155" height="54" rx="12" fill="#E7F4FA" stroke="#2E86AB"/>
    <text x="247" y="543" text-anchor="middle" font-weight="700">Reactive</text>
    <text x="247" y="562" text-anchor="middle">chatbot</text>
    <rect x="390" y="455" width="170" height="62" rx="12" fill="#FFF6DB" stroke="#F6C85F"/>
    <text x="475" y="480" text-anchor="middle" font-weight="700">Tool-using</text>
    <text x="475" y="501" text-anchor="middle">assistant</text>
    <rect x="625" y="330" width="180" height="70" rx="12" fill="#FFE9E9" stroke="#D1495B"/>
    <text x="715" y="356" text-anchor="middle" font-weight="700">Multi-step</text>
    <text x="715" y="378" text-anchor="middle">agent</text>
    <rect x="865" y="220" width="175" height="75" rx="12" fill="#F9D7DD" stroke="#D1495B"/>
    <text x="952" y="247" text-anchor="middle" font-weight="700">Autonomous</text>
    <text x="952" y="269" text-anchor="middle">action system</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#3D4A5C">
    <text x="175" y="635">low autonomy</text>
    <text x="940" y="635">high autonomy</text>
    <text x="98" y="588" text-anchor="end">low</text>
    <text x="98" y="170" text-anchor="end">high</text>
  </g>
  <rect x="132" y="120" width="910" height="12" rx="6" fill="url(#riskGrad)" opacity="0.35"/>
  <text x="130" y="704" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#657486">Conceptual figure for governance review; not a calibrated mathematical model.</text>
</svg>
