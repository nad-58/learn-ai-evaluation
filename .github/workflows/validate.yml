name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile repository Python
        run: python -m compileall -q src tests examples scripts
      - name: Run full test suite
        run: python -m pytest tests -q
      - name: Run lightweight examples
        run: python scripts/run_all_examples.py
      - name: Run benchmark regression checks
        run: python scripts/run_benchmark.py
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: reports/
      - name: Audit installed dependencies
        run: python -m pip_audit
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
