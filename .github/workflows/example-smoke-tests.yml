name: Example smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run dataset evaluation example
        run: python examples/dataset-evaluation/dataset_quality_example.py

      - name: Run computer vision example
        run: python examples/computer-vision-evaluation/cv_metrics_example.py

      - name: Run medical AI example
        run: python examples/medical-ai-evaluation/medical_ai_evaluation_example.py

      - name: Run LLM example
        run: python examples/llm-evaluation/basic_llm_metrics_example.py

      - name: Run VLM example
        run: python examples/vlm-evaluation/basic_vlm_evaluation_example.py
